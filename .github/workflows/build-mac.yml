name: Build Swift macOS Universal App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      THK_MAC_BACKEND: swift

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node for web regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Chatwork extensions
        run: |
          for check in toolkit files downloads file-preview branding ui-render request-navigation formatting-editors mention; do
            node "examples/$check-regression.cjs"
          done

      - name: Test Swift and build Universal macOS app
        run: bash build-mac.sh --universal

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: THK-macOS-Universal-DMG
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: THK-macOS-Universal-Archive
          path: |
            dist/THK-Chat-v*-macOS-*.zip
            dist/THK-Chat-v*-macOS-*.tar.gz
          if-no-files-found: error

