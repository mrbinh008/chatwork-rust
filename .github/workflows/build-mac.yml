name: Build macOS Universal App

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Universal macOS DMG
        run: |
          chmod +x build-mac.sh
          ./build-mac.sh --universal

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: THK-macOS-Universal-DMG
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: THK-macOS-App
          path: dist/THK-Chat-v*-macOS-*/THK-Chat.app
          if-no-files-found: error

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: THK-macOS-Universal-Archive
          path: |
            dist/THK-Chat-v*-macOS-*.zip
            dist/THK-Chat-v*-macOS-*.tar.gz
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/THK-Chat-v*-macOS-*.zip
            dist/THK-Chat-v*-macOS-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
