[package]
name = "chatwork-rs"
version = "2.26.12"
repository = "https://github.com/mrbinh008/chatwork-rust"
edition = "2021"
description = "THK-Chat Desktop Client"
authors = ["THK Team"]
license = "proprietary"

[[bin]]
name = "chatwork"
path = "src/main.rs"

[dependencies]
# WebView + Windowing
wry = { version = "0.57", features = ["devtools"] }
tao = "0.37"
muda = "0.21"
tray-icon = "0.26"

# Native notifications
notify-rust = "4"




# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cross-platform config directory
dirs = "5"

# Open links in default browser
open = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Target-specific: Windows
[target.'cfg(windows)'.dependencies]
winrt-notification = { version = "0.8", package = "tauri-winrt-notification" }
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Registry",
] }




# Target-specific: macOS
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
